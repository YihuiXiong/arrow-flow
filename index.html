<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>箭头反应 · Arrow Flow</title>
<script src="./theme.js"></script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="home">
  <div class="home-mark">ARROW FLOW</div>
  <div class="dial" aria-hidden="true">
    <svg class="dial-ticks" viewBox="0 0 180 180"><line class="tick-mark" data-deg="0" x1="90" y1="3" x2="90" y2="13" transform="rotate(0 90 90)"/><line class="tick-mark on" data-deg="45" x1="90" y1="3" x2="90" y2="10" transform="rotate(45 90 90)"/><line class="tick-mark" data-deg="90" x1="90" y1="3" x2="90" y2="13" transform="rotate(90 90 90)"/><line class="tick-mark" data-deg="135" x1="90" y1="3" x2="90" y2="10" transform="rotate(135 90 90)"/><line class="tick-mark" data-deg="180" x1="90" y1="3" x2="90" y2="13" transform="rotate(180 90 90)"/><line class="tick-mark" data-deg="225" x1="90" y1="3" x2="90" y2="10" transform="rotate(225 90 90)"/><line class="tick-mark" data-deg="270" x1="90" y1="3" x2="90" y2="13" transform="rotate(270 90 90)"/><line class="tick-mark" data-deg="315" x1="90" y1="3" x2="90" y2="10" transform="rotate(315 90 90)"/></svg>
    <svg class="home-arrow" id="home-arrow" viewBox="0 0 100 100"><path d="M50 88V13M17 46L50 13L83 46" fill="none" stroke="currentColor" stroke-width="7"/></svg>
    <span id="home-number" class="home-number hidden">3</span>
  </div>
  <h1 id="home-title">箭头反应</h1>
  <button id="start" class="start">开始</button>

  <p id="session-info" class="session-info"></p>
  <button id="open-settings" class="settings-trigger" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--bg)"/><circle cx="15" cy="17" r="3" fill="var(--bg)"/></svg>设置</button>
</main>
<dialog id="settings-dialog" aria-labelledby="settings-title" class="settings-dialog"><div class="sheet-header"><div><span class="sheet-eyebrow">MAKE IT YOURS</span><h2 id="settings-title">训练设置</h2></div><button id="close-settings" class="close-settings" aria-label="关闭设置" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="sheet-scroll settings-body"><section class="setting-group"><h3><span>01</span>训练</h3><div class="setting-card"><label id="mode-label">练习模式</label><input id="training-mode" type="hidden" value="arrows"><div class="presets mode-options" role="group" aria-labelledby="mode-label"><button type="button" data-mode="arrows" aria-label="箭头模式" aria-pressed="true"><span class="mode-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></span><span class="mode-title">箭头模式</span><span class="mode-description">方向与颜色</span><svg class="mode-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg></button><button type="button" data-mode="numbers" aria-label="数字模式" aria-pressed="false"><span class="mode-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 3 7 21M18 3l-3 18M4 9h17M3 15h17"/></svg></span><span class="mode-title">数字模式</span><span class="mode-description">数字与背景颜色</span><svg class="mode-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg></button></div><div class="settings-block"><div class="block-heading">练习内容</div><div id="number-range" hidden><div class="two"><div><label for="number-min">最小数字</label><input id="number-min" type="number" min="0" max="999" step="1" value="1" required inputmode="numeric"></div><div><label for="number-max">最大数字</label><input id="number-max" type="number" min="0" max="999" step="1" value="5" required inputmode="numeric"></div></div><p id="number-help" class="field-help">范围内的整数随机出现，背景颜色独立随机。</p></div><div class="two"><div id="dirs-field">      <label for="dirs">箭头方向</label>
      <select id="dirs">
        <option value="8">八方向（含斜向）</option>
        <option value="4">四方向（上下左右）</option>
        <option value="2">两方向（左右）</option>
      </select></div>

        <div><label for="rounds-choice">每组轮数</label>
          <input id="rounds" type="hidden" value="20"><select id="rounds-choice" aria-controls="custom-rounds"><option value="10">10 轮</option><option value="20" selected>20 轮</option><option value="30">30 轮</option><option value="50">50 轮</option><option value="100">100 轮</option><option value="0">无限循环</option><option value="custom">自定义…</option></select><div id="custom-rounds" hidden style="margin-top:12px"><label for="rounds-custom" style="margin-top:0">自定义轮数</label><input id="rounds-custom" type="number" min="1" step="1" value="20" inputmode="numeric"></div>
        </div>
</div><div class="two"><div><label for="sets-choice">组数</label><input id="sets" type="hidden" value="1"><select id="sets-choice" aria-controls="sets-custom-wrap"><option value="1" selected>1 组</option><option value="2">2 组</option><option value="3">3 组</option><option value="4">4 组</option><option value="5">5 组</option><option value="6">6 组</option><option value="8">8 组</option><option value="10">10 组</option><option value="custom">自定义…</option></select><div id="sets-custom-wrap" hidden style="margin-top:12px"><label for="sets-custom" style="margin-top:0">自定义组数</label><input id="sets-custom" type="number" min="1" max="99" step="1" value="1" inputmode="numeric"></div></div><div><label for="set-rest-choice">组间休息 / 秒</label><input id="set-rest" type="hidden" value="30"><select id="set-rest-choice" aria-controls="set-rest-custom-wrap"><option value="0">不休息</option><option value="10">10 秒</option><option value="15">15 秒</option><option value="20">20 秒</option><option value="30" selected>30 秒</option><option value="45">45 秒</option><option value="60">60 秒</option><option value="90">90 秒</option><option value="120">120 秒</option><option value="180">180 秒</option><option value="custom">自定义…</option></select><div id="set-rest-custom-wrap" hidden style="margin-top:12px"><label for="set-rest-custom" style="margin-top:0">自定义休息 / 秒</label><input id="set-rest-custom" type="number" min="0" max="600" step="1" value="30" inputmode="numeric"></div></div></div><p id="sets-help" class="field-help">每组完成后休息，倒计时结束自动继续。</p>      </div><div class="settings-block"><div class="block-heading">节奏与间隔</div><label id="interval-label">间隔模式</label><input id="interval-mode" type="hidden" value="fixed"><div class="presets interval-toggle" role="group" aria-labelledby="interval-label" aria-describedby="interval-help"><button type="button" data-interval="fixed" aria-pressed="true">固定间隔</button><button type="button" data-interval="random" aria-pressed="false">随机间隔</button></div><label id="presets-label">节奏预设</label>
      <div class="presets" role="group" aria-labelledby="presets-label">
        <button type="button" data-speed="2.5,1" data-random-speed="2.5,1,3" aria-pressed="false">舒缓</button>
        <button type="button" data-speed="1.5,0.5" data-random-speed="1.5,0.5,1.5" aria-pressed="false">标准</button>
        <button type="button" data-speed="0.7,0.3" data-random-speed="0.7,0.2,0.6" aria-pressed="false">快速</button>
      </div>

      <label for="duration" id="duration-label">显示 / 秒</label><input id="duration" type="number" min="0.3" max="10" step="0.1" value="1.5">
      <div class="interval-settings"><p id="interval-help" class="field-help">当前提示消失后，到下一个提示出现前的等待时间。</p><div id="fixed-interval"><label for="gap">等待时间 / 秒</label><input id="gap" type="number" min="0" max="10" step="0.1" value="0.5"></div><div id="random-interval" hidden><div class="two"><div><label for="gap-min">最短等待 / 秒</label><input id="gap-min" type="number" min="0" max="10" step="0.1" value="0.5"></div><div><label for="gap-max">最长等待 / 秒</label><input id="gap-max" type="number" min="0" max="10" step="0.1" value="1.5"></div></div><p class="field-help">每次在范围内重新随机，不按固定节奏出现。</p></div></div>

</div></div></section><section class="setting-group"><h3><span>02</span>外观</h3><div class="setting-card">      <label for="language">语言 / Language</label><select id="language"><option value="zh">简体中文</option><option value="en">English</option></select><label for="theme">外观</label>
      <select id="theme">
        <option value="system">跟随系统</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
        <div id="color-field"><label for="color">箭头颜色</label>
          <select id="color"><option value="random">随机彩色</option><option value="green">固定绿色</option><option value="black">固定黑色</option><option value="custom">自定义单色</option></select><div id="custom-arrow-color" hidden><label for="arrow-color">自定义箭头颜色</label><input id="arrow-color" type="color" value="#20ac78" aria-label="自定义箭头颜色"></div>
        </div>
<div id="number-color-settings" hidden><label id="palette-label">数字背景颜色</label><input id="arrow-colors" type="hidden" value='["#20ac78","#823ac7","#257bdd","#e2812b","#dc4168"]'><input id="number-colors" type="hidden" value='["#d83842","#16816b","#f3cf46","#245fbd"]'><div id="number-palette" class="number-palette" role="group" aria-labelledby="palette-label"></div><div class="palette-actions"><button id="add-number-color" type="button">添加颜色</button><button id="reset-number-colors" type="button">恢复默认</button></div><p id="palette-help" class="field-help">点色块更换颜色，背景与数字独立随机。</p></div></div></section><section class="setting-group"><h3><span>03</span>声音</h3><div class="setting-card">      <section id="sound-settings" class="sound" aria-label="声音设置">
        <div class="sound-head">
          <span class="sound-title">提示音</span>
          <button id="sound" class="switch" type="button" role="switch" aria-label="提示音" aria-checked="false" value="off"><span></span></button>
        </div>
        <div id="sound-panel" hidden>
          <label for="sound-type" style="margin-top:0">声音类型</label>
          <select id="sound-type">
            <option value="beep">标准短音</option>
            <option value="timer">计时器哔声</option>
            <option value="go">起跑高音</option>
            <option value="bell">拳击铃</option>
            <option value="bell2">拳击铃 · 双响</option>
            <option value="buzzer">篮球蜂鸣</option>
          </select>
          <div class="volume-head"><label for="volume">提示音量</label><output id="volume-value" for="volume">40%</output></div>
          <input id="volume" type="range" min="0" max="100" value="40" aria-describedby="volume-help">
          <div class="sound-foot"><span id="volume-help">同时受设备音量控制</span><button type="button" id="preview">试听</button></div>
        </div>
      </section></div></section></div><div class="sheet-footer"><span>按你的节奏来。</span><button id="done-settings" class="start" type="button">完成</button></div></dialog>


<section id="stage" class="stage" aria-label="反应练习">
  <div class="top">
    <span class="phase" id="phase">准备开始</span>
    <span class="counter" id="counter" aria-live="off">0 / 20</span>
    <div class="top-right">
      <button id="mute" class="icon-btn" type="button" aria-label="开启声音">
        <svg id="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg id="icon-off" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
      </button>
    </div>
  </div>

  <div id="number-cue" class="number-cue-text hidden" role="img" aria-label="数字"></div>
  <svg id="arrow" class="hidden" viewBox="0 0 100 100" role="img" aria-label="方向箭头"><path d="M50 88V13M17 46L50 13L83 46" fill="none" stroke="currentColor" stroke-width="10"/></svg>
  <div id="countdown" class="countdown"><span id="count-num">3</span></div>

  <div id="rest" class="rest hidden" role="timer" aria-label="组间休息倒计时" aria-live="off"><div class="rest-dial"><svg class="rest-ring" viewBox="0 0 200 200" aria-hidden="true"><circle class="rest-track" cx="100" cy="100" r="96"/><circle id="rest-ring-fill" class="rest-fill" cx="100" cy="100" r="96" pathLength="1"/></svg><div class="rest-inner"><span class="rest-label">组间休息</span><span id="rest-time" class="rest-time">0:30</span></div></div><span id="rest-next" class="rest-next"></span></div>
  <div id="result" class="result hidden" role="status" aria-live="polite">
    <svg class="done-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29"/><path d="M20 33l8 8 16-17"/></svg>
    <h2>Complete</h2>
    <button id="again" class="start">再练一次</button>
    <button id="back" class="ghost">调整设置</button>
  </div>

  <div class="controls" id="controls">
    <button id="pause" class="round-btn" aria-label="暂停">
      <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg id="icon-play" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <button id="exit" class="round-btn" aria-label="结束练习">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
    </button>
  </div>
  <div class="progress" id="progress"></div>
</section>

<script src="./i18n.js"></script>
<script src="./app.js"></script>
</body>
</html>
