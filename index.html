<style>

}

*{box-sizing:border-box}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

/* Home */
.home{min-height:100svh;max-width:420px;margin:auto;padding:60px 28px 40px;display:flex;flex-direction:column;align-items:center}
.home-mark{font-size:10px;letter-spacing:.22em;color:var(--muted)}

.home-arrow{position:absolute;left:19%;top:19%;width:62%;height:62%;color:var(--accent);transform:rotate(45deg);transition:transform .6s var(--snap)}
.home h1{font-size:18px;font-weight:400;letter-spacing:.13em;margin:0 0 44px}
.start{min-width:168px;height:50px;border:0;border-radius:25px;padding:0 28px;font-size:15px;letter-spacing:.08em;background:var(--btn);color:var(--btn-text);transition:transform .15s var(--out),background .2s}

.presets button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--soft)}

/* Sound settings */
.sound{margin-top:24px;padding-top:20px;border-top:1px solid var(--soft)}

.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{transform:translateX(18px)}
#sound-panel{margin-top:23px}
#sound-panel[hidden]{display:none}
#sound-type{margin-bottom:22px}
.volume-head{display:flex;justify-content:space-between;align-items:center}

.sound-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted)}

.stage{display:none;position:fixed;inset:0;z-index:10;background:var(--bg);align-items:center;justify-content:center;transition:background-color .45s ease}
.stage.resting{background:var(--rest-bg)}

#arrow{width:clamp(165px,36vmin,480px);height:clamp(165px,36vmin,480px)}
.top{position:absolute;top:max(22px,env(safe-area-inset-top));left:24px;right:24px;display:flex;justify-content:space-between;align-items:center}
.phase{max-width:34%;line-height:1.6;font-size:12px;letter-spacing:.05em;color:var(--muted)}
.top-right{display:flex;gap:8px;align-items:center}

.round-btn{display:grid;place-items:center;width:52px;height:52px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--muted);transition:transform .15s var(--out),color .2s}

.rest{display:flex;flex-direction:column;align-items:center;gap:30px;animation:controls-in .35s var(--out)}.rest-dial{position:relative;display:grid;place-items:center;width:clamp(230px,48vmin,340px);aspect-ratio:1}.rest-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:rotate(-90deg)}.rest-ring circle{fill:none;stroke-width:2}.rest-track{stroke:var(--line)}.rest-fill{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}.rest-inner{display:flex;flex-direction:column;align-items:center;gap:14px}.rest-label{font-size:12px;letter-spacing:.12em;color:var(--muted)}.rest-time{font-family:var(--num);font-size:clamp(62px,13vmin,92px);font-weight:400;line-height:1.05;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.rest-next{font-size:13px;letter-spacing:.06em;color:var(--text)}.stage.paused .rest-fill{stroke:var(--muted)}@media(max-height:500px){.rest{gap:14px}.rest-dial{width:clamp(160px,52vmin,230px)}.rest-time{font-size:54px}.rest-inner{gap:8px}}.countdown{position:relative;display:grid;place-items:center;width:clamp(160px,34vmin,240px);height:clamp(160px,34vmin,240px)}
.countdown svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-track,.ring-fill{fill:none;stroke-width:3}
.ring-track{stroke:var(--soft)}
.ring-fill{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:0}
.countdown.tick .ring-fill{animation:drain 1s linear forwards}
@keyframes drain{to{stroke-dashoffset:339.3}}
#count-num{font-family:var(--num);font-size:clamp(72px,16vmin,112px);font-weight:300;line-height:1;color:var(--countdown);font-variant-numeric:tabular-nums}
.countdown.tick #count-num{animation:pop .5s var(--out)}
@keyframes pop{from{opacity:0;transform:scale(1.4)}}
.result{text-align:center;padding:30px}
.done-mark{display:block;width:64px;height:64px;margin:0 auto 6px;color:var(--accent)}
.done-mark circle,.done-mark path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done-mark circle{stroke-dasharray:182.3;animation:draw .7s var(--out) both}
.done-mark path{stroke-dasharray:40;animation:draw .45s var(--out) .45s both}
@keyframes draw{from{stroke-dashoffset:var(--len,182.3)}}
.done-mark path{--len:40}
.result>*{animation:rise .6s var(--out) both}
.result>:nth-child(2){animation-delay:.25s}.result>:nth-child(3){animation-delay:.35s}.result>:nth-child(4){animation-delay:.45s}.result>:nth-child(5){animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.result .done-mark{animation:none}
.result h2{font-size:32px;margin:15px 0}
.result p{color:var(--muted);line-height:1.7}
.result .start{width:100%;margin-top:18px}
.result{width:min(340px,100%)}
.result .ghost{width:100%;margin-top:12px;height:46px;border:1px solid var(--line);border-radius:23px;background:transparent;color:var(--muted)}
.progress{position:absolute;bottom:0;left:0;height:4px;border-radius:0 2px 2px 0;background:var(--accent);opacity:.5;transition:width .35s var(--out)}

@media (max-height:600px){.home{padding-top:25px}.dial{width:130px;height:130px;margin:30px 0 20px}.home h1{margin-bottom:24px}}
@media (max-height:500px){#arrow{width:48vmin;height:48vmin}.controls{bottom:12px}.top{top:12px}}

/* Larger opening screen; quiet completion view. */
.home{max-width:460px;padding-top:48px}.home-mark{font-size:11px;letter-spacing:.24em}.dial{width:clamp(210px,29vmin,260px);height:clamp(210px,29vmin,260px);margin:clamp(44px,10vh,96px) 0 34px}.home h1{font-size:24px;letter-spacing:.12em;margin-bottom:36px}.home>.start{min-width:200px;height:56px;font-size:16px;border-radius:28px}
.stage.finished .top,.stage.finished .progress{display:none}.result{width:min(360px,100%);padding:32px}.result .done-mark{width:84px;height:84px;margin:0 auto 32px}.done-mark circle{fill:var(--soft);stroke:var(--accent);stroke-width:1.5}.done-mark path{stroke-width:2.8}.result h2{font-size:clamp(36px,7vmin,48px);font-weight:450;letter-spacing:-.045em;line-height:1.15;margin:0 0 44px}.result .start{height:52px;margin:0;border-radius:26px;font-size:14px;letter-spacing:.02em}.result .ghost{border:0;background:transparent;height:44px;margin-top:12px;font-size:13px;letter-spacing:.02em}.result .ghost:hover{color:var(--text)}
@media(max-height:650px){.home{padding-top:28px}.dial{width:190px;height:190px;margin:30px 0 24px}.home h1{font-size:22px;margin-bottom:28px}}@media(max-height:430px){.dial{width:150px;height:150px;margin:12px 0 16px}.home h1{margin-bottom:18px}.result .done-mark{width:60px;height:60px;margin-bottom:18px}.result h2{margin-bottom:26px}}

/* Quiet surfaces, focused settings sheet */
.home{min-height:100svh;max-width:480px;justify-content:center;padding:40px 28px 48px}.home-mark{font-size:10px;letter-spacing:.32em;opacity:.8}.dial{width:clamp(220px,30vmin,280px);height:clamp(220px,30vmin,280px);margin:clamp(44px,9vh,86px) 0 34px}.tick-mark{stroke-width:2}.home h1{font-size:25px;letter-spacing:.1em;margin-bottom:36px}.home>.start{min-width:204px;box-shadow:0 6px 18px #193a2510}.session-info{font-size:11px;color:var(--muted);letter-spacing:.05em;margin:20px 0 14px}.settings-trigger{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 17px;border:0;border-radius:22px;background:transparent;color:var(--muted);font-size:12px;transition:background .2s,color .2s,transform .2s}.settings-trigger svg{width:17px;height:17px}.settings-trigger:hover{color:var(--text);background:var(--soft)}.settings-trigger:active{transform:scale(.96)}
body:has(.settings-dialog[open]){overflow:hidden}.settings-dialog{--sheet-bg:var(--bg);width:min(480px,calc(100% - 40px));max-height:min(86svh,880px);padding:0;border:1px solid var(--line);border-radius:26px;background:var(--sheet-bg);color:var(--text);box-shadow:0 30px 110px #0002;overflow:hidden;overscroll-behavior:contain}.settings-dialog[open]{display:flex;flex-direction:column;animation:sheet-in .32s var(--out) both}.settings-dialog::backdrop{background:#101a1460;backdrop-filter:blur(7px);animation:backdrop-in .25s both}.settings-dialog.is-closing{animation:sheet-out .18s ease-in both}.settings-dialog.is-closing::backdrop{animation:backdrop-out .18s both}.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:28px 28px 23px;border-bottom:1px solid var(--soft);flex-shrink:0}.sheet-eyebrow{font-size:9px;letter-spacing:.21em;color:var(--muted)}.sheet-header h2{font-size:23px;font-weight:500;letter-spacing:-.03em;margin:8px 0 0}.close-settings{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:var(--soft);color:var(--muted);transition:transform .2s,color .2s}.close-settings:hover{color:var(--text);transform:rotate(90deg)}.close-settings svg{width:17px;height:17px}.sheet-scroll.settings-body{padding:24px;overflow:auto;margin:0;border:0;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.setting-group{margin:0 0 24px}.setting-group:last-child{margin-bottom:0}.setting-group h3{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:500;margin:0 4px 12px}.setting-group h3 span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.setting-card{background:var(--soft);border:1px solid var(--soft);padding:18px;border-radius:17px}.interval-settings{margin-top:20px;padding-top:2px;border-top:1px solid var(--line)}#random-interval:not([hidden]),#fixed-interval:not([hidden]){animation:controls-in .22s var(--out)}.field-help{display:block;margin-top:7px;font-size:10px;line-height:1.4;color:var(--muted)}.setting-card label{font-size:11px;margin:18px 0 8px}.setting-card>label:first-child{margin-top:0}.setting-card>div>label:first-child{margin-top:18px}.setting-card>.two:first-child>div>label{margin-top:0}.setting-card select,.setting-card input[type=number]{height:46px;border-color:transparent;border-radius:10px;background-color:var(--field);font-size:13px}.setting-card select:focus,.setting-card input:focus{border-color:var(--focus)}.setting-card .presets{padding:4px;background:var(--field);border-radius:11px;gap:3px}.setting-card .presets button{min-height:36px;border:0;border-radius:8px;font-size:12px;transition:background .18s,color .18s,box-shadow .18s}.setting-card .presets button[aria-pressed="true"]{background:var(--soft);color:var(--accent);box-shadow:0 1px 4px #00000008}.setting-card .sound{border:0;margin:0;padding:0}.setting-card .sound-title{font-size:13px}.setting-card #sound-panel{border-top:1px solid var(--line);padding-top:20px;margin-top:18px;animation:controls-in .22s var(--out)}.setting-card #sound-type{margin-bottom:20px}.setting-card .volume-head label{margin:0}.setting-card .sound-foot{font-size:10px}.setting-card #preview{background:var(--field);border:0;border-radius:9px;min-height:40px;padding:8px 18px}.setting-card #volume{height:6px}.sheet-footer{padding:17px 24px 21px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--soft);flex-shrink:0}.sheet-footer>span{font-size:11px;color:var(--muted)}.sheet-footer .start{height:44px;min-width:112px;border-radius:13px;font-size:13px;letter-spacing:.02em}.stage.active{animation:stage-in .25s var(--out)}.result{animation:complete-in .45s var(--out)}

<body>
<main class="home">
  <div class="home-mark">ARROW FLOW</div>
  <div class="dial" aria-hidden="true">
    <svg class="dial-ticks" viewBox="0 0 180 180"><line class="tick-mark" data-deg="0" x1="90" y1="3" x2="90" y2="13" transform="rotate(0 90 90)"/><line class="tick-mark on" data-deg="45" x1="90" y1="3" x2="90" y2="10" transform="rotate(45 90 90)"/><line class="tick-mark" data-deg="90" x1="90" y1="3" x2="90" y2="13" transform="rotate(90 90 90)"/><line class="tick-mark" data-deg="135" x1="90" y1="3" x2="90" y2="10" transform="rotate(135 90 90)"/><line class="tick-mark" data-deg="180" x1="90" y1="3" x2="90" y2="13" transform="rotate(180 90 90)"/><line class="tick-mark" data-deg="225" x1="90" y1="3" x2="90" y2="10" transform="rotate(225 90 90)"/><line class="tick-mark" data-deg="270" x1="90" y1="3" x2="90" y2="13" transform="rotate(270 90 90)"/><line class="tick-mark" data-deg="315" x1="90" y1="3" x2="90" y2="10" transform="rotate(315 90 90)"/></svg>
    <svg class="home-arrow" id="home-arrow" viewBox="0 0 100 100"><path d="M50 88V13M17 46L50 13L83 46" fill="none" stroke="currentColor" stroke-width="7"/></svg>
    <span id="home-number" class="home-number hidden">3</span>
  </div>
  <h1 id="home-title">箭头反应</h1>
  <button id="start" class="start">开始</button>

  <p id="session-info" class="session-info"></p>

<dialog id="settings-dialog" aria-labelledby="settings-title" class="settings-dialog"><div class="sheet-header"><div><span class="sheet-eyebrow">MAKE IT YOURS</span><h2 id="settings-title">训练设置</h2></div><button id="close-settings" class="close-settings" aria-label="关闭设置" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="sheet-scroll settings-body"><section class="setting-group"><h3><span>01</span>训练</h3><div class="setting-card"><label id="mode-label">练习模式</label><input id="training-mode" type="hidden" value="arrows"><div class="presets" role="group" aria-labelledby="mode-label"><button type="button" data-mode="arrows" aria-pressed="true">箭头模式</button><button type="button" data-mode="numbers" aria-pressed="false">数字模式</button></div><p id="number-help" class="field-help" hidden>1–5 随机出现，背景颜色独立随机。</p><div class="two"><div id="dirs-field">      <label for="dirs">箭头方向</label>
      <select id="dirs">
        <option value="8">八方向（含斜向）</option>
        <option value="4">四方向（上下左右）</option>
        <option value="2">两方向（左右）</option>
      </select></div>

        <div><label for="rounds-choice">每组轮数</label>
          <input id="rounds" type="hidden" value="20"><select id="rounds-choice" aria-controls="custom-rounds"><option value="10">10 轮</option><option value="20" selected>20 轮</option><option value="30">30 轮</option><option value="50">50 轮</option><option value="100">100 轮</option><option value="0">无限循环</option><option value="custom">自定义…</option></select><div id="custom-rounds" hidden style="margin-top:12px"><label for="rounds-custom" style="margin-top:0">自定义轮数</label><input id="rounds-custom" type="number" min="1" step="1" value="20" inputmode="numeric"></div>
        </div>
</div><div class="two"><div><label for="sets-choice">组数</label><input id="sets" type="hidden" value="1"><select id="sets-choice" aria-controls="sets-custom-wrap"><option value="1" selected>1 组</option><option value="2">2 组</option><option value="3">3 组</option><option value="4">4 组</option><option value="5">5 组</option><option value="6">6 组</option><option value="8">8 组</option><option value="10">10 组</option><option value="custom">自定义…</option></select><div id="sets-custom-wrap" hidden style="margin-top:12px"><label for="sets-custom" style="margin-top:0">自定义组数</label><input id="sets-custom" type="number" min="1" max="99" step="1" value="1" inputmode="numeric"></div></div><div><label for="set-rest-choice">组间休息 / 秒</label><input id="set-rest" type="hidden" value="30"><select id="set-rest-choice" aria-controls="set-rest-custom-wrap"><option value="0">不休息</option><option value="10">10 秒</option><option value="15">15 秒</option><option value="20">20 秒</option><option value="30" selected>30 秒</option><option value="45">45 秒</option><option value="60">60 秒</option><option value="90">90 秒</option><option value="120">120 秒</option><option value="180">180 秒</option><option value="custom">自定义…</option></select><div id="set-rest-custom-wrap" hidden style="margin-top:12px"><label for="set-rest-custom" style="margin-top:0">自定义休息 / 秒</label><input id="set-rest-custom" type="number" min="0" max="600" step="1" value="30" inputmode="numeric"></div></div></div><p id="sets-help" class="field-help">每组完成后休息，倒计时结束自动继续。</p>      <label id="interval-label">间隔模式</label><input id="interval-mode" type="hidden" value="fixed"><div class="presets interval-toggle" role="group" aria-labelledby="interval-label" aria-describedby="interval-help"><button type="button" data-interval="fixed" aria-pressed="true">固定间隔</button><button type="button" data-interval="random" aria-pressed="false">随机间隔</button></div><label id="presets-label">节奏预设</label>
      <div class="presets" role="group" aria-labelledby="presets-label">
        <button type="button" data-speed="2.5,1" data-random-speed="2.5,1,3" aria-pressed="false">舒缓</button>
        <button type="button" data-speed="1.5,0.5" data-random-speed="1.5,0.5,1.5" aria-pressed="false">标准</button>
        <button type="button" data-speed="0.7,0.3" data-random-speed="0.7,0.2,0.6" aria-pressed="false">快速</button>
      </div>

      <label for="duration" id="duration-label">显示 / 秒</label><input id="duration" type="number" min="0.3" max="10" step="0.1" value="1.5">

</div></section><section class="setting-group"><h3><span>02</span>外观</h3><div class="setting-card">      <label for="theme">外观</label>

</div></section><section class="setting-group"><h3><span>03</span>声音</h3><div class="setting-card">      <section id="sound-settings" class="sound" aria-label="声音设置">

        </div>
      </section></div></section></div><div class="sheet-footer"><span>按你的节奏来。</span><button id="done-settings" class="start" type="button">完成</button></div></dialog>

        <svg id="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg id="icon-off" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
      </button>
    </div>
  </div>

  <div id="number-cue" class="number-cue-text hidden" role="img" aria-label="数字"></div>

  <div id="countdown" class="countdown"><span id="count-num">3</span></div>

  <div id="rest" class="rest hidden" role="timer" aria-label="组间休息倒计时" aria-live="off"><div class="rest-dial"><svg class="rest-ring" viewBox="0 0 200 200" aria-hidden="true"><circle class="rest-track" cx="100" cy="100" r="96"/><circle id="rest-ring-fill" class="rest-fill" cx="100" cy="100" r="96" pathLength="1"/></svg><div class="rest-inner"><span class="rest-label">组间休息</span><span id="rest-time" class="rest-time">0:30</span></div></div><span id="rest-next" class="rest-next"></span></div>

    <button id="again" class="start">再练一次</button>
    <button id="back" class="ghost">调整设置</button>
  </div>

  <div class="controls" id="controls">

      <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>

    </button>
    <button id="exit" class="round-btn" aria-label="结束练习">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
    </button>
  </div>
  <div class="progress" id="progress"></div>
</section>

    if(!audioCtx||audioCtx.state==='closed'||audioCtx.state==='interrupted'){
      const old=audioCtx;audioCtx=new AC();if(old)old.close().catch(()=>{});
    }
    const ctx=audioCtx;
    // Both resume and the silent source start inside the tap gesture, before awaiting decoding.
    const ready=ctx.state==='running'?Promise.resolve():ctx.resume();
    const prime=ctx.createBufferSource();prime.buffer=ctx.createBuffer(1,1,ctx.sampleRate);prime.connect(ctx.destination);prime.start();prime.onended=()=>prime.disconnect();
    await Promise.all([ready,loadSound($('sound-type').value,ctx)]);
    Promise.allSettled(Object.keys(SOUNDS).map(k=>loadSound(k,ctx)));
  }catch{}
}
function play(key){
  const vol=+$('volume').value/100,ctx=audioCtx;
  if(!soundOn()||vol<=0||!ctx)return;
  const requested=performance.now();
  const emit=()=>{
    if(!soundOn()||ctx!==audioCtx||ctx.state!=='running'||performance.now()-requested>500)return;
    const buf=buffers[key]||buffers.beep;if(!buf)return;
    try{
      if(playing)try{playing.stop()}catch{}
      const src=ctx.createBufferSource(),gain=ctx.createGain();
      src.buffer=buf;gain.gain.value=+$('volume').value/100;
      src.connect(gain);gain.connect(ctx.destination);src.start();
      playing=src;src.onended=()=>{src.disconnect();gain.disconnect();if(playing===src)playing=null};
    }catch{}
  };
  if(ctx.state==='running')emit();else ctx.resume().then(emit).catch(()=>{});
}
const cue=()=>play($('sound-type').value);

function syncSound(){
  const on=soundOn(),v=+$('volume').value,text=v===0?'静音':v+'%';
  $('sound').setAttribute('aria-checked',String(on));
  $('sound-panel').hidden=!on;
  $('volume').disabled=!on;
  $('preview').disabled=!on||v===0;
  $('volume-value').textContent=text;
  $('volume').setAttribute('aria-valuetext',text);
  $('volume').style.background=`linear-gradient(to right,var(--accent) ${v}%,var(--soft) ${v}%)`;
  $('mute').setAttribute('aria-label',on?'关闭声音':'开启声音');
  $('icon-on').classList.toggle('hidden',!on);
  $('icon-off').classList.toggle('hidden',on);
}
function setSound(on){$('sound').value=on?'on':'off';syncSound();save();if(on)return unlockSound();else stopKeepAlive()}

/* ---------- 练习流程 ---------- */
function schedule(fn,ms){clearTimeout(timer);next=fn;left=ms;due=performance.now()+ms;timer=setTimeout(fn,ms)}
function show(id,on){$(id).classList.toggle('hidden',!on)}
function updatePhase(){
  const phase=state==='paused'?'已暂停':state==='countdown'?'准备开始':state==='rest'?(restSeconds<=3?'准备开始':'组间休息'):'';const preparing=(state==='rest'||state==='paused'&&resumeState==='rest')&&restSeconds<=3;const group=config.rounds?'第 '+(preparing?set+1:set)+' / '+config.sets+' 组':'';const text=[group,phase].filter(Boolean).join(' · ');
  $('phase').textContent=text;
  $('phase').style.visibility=text?'visible':'hidden';
}
function setPauseIcon(paused){
  show('icon-pause',!paused);show('icon-play',paused);
  $('pause').setAttribute('aria-label',paused?'继续':'暂停');
}
function updateCounter(){$('counter').textContent=config.rounds?round+' / '+config.rounds:String(round)}
async function keepAwake(){try{wake=await navigator.wakeLock?.request('screen')}catch{}}
function releaseWake(){try{wake?.release()}catch{}wake=null}
const clamp=(v,lo,hi,fallback)=>Math.max(lo,Math.min(hi,Number.isFinite(v)?v:fallback));

function start(){
  clearNumberCue();$('stage').classList.toggle('number-mode',$('training-mode').value==='numbers');
  $('stage').classList.remove('resting');
  cancelAnimationFrame(restFrame);
  if(!validateIntervals()){openSettings();$('gap-max').focus();$('gap-max').reportValidity();return;}
  const requestedRounds=$('rounds').value.trim()===''?20:+$('rounds').value;
  $('rounds').value=String(Number.isFinite(requestedRounds)?Math.max(0,Math.min(Number.MAX_SAFE_INTEGER,Math.floor(requestedRounds))):20);sessionInfo();
  config={
    mode:$('training-mode').value,
    dirs:+$('dirs').value,
    duration:clamp(+$('duration').value||1.5,.3,10,1.5)*1000,
    gap:clamp(+$('gap').value,0,10,.5)*1000,
    intervalMode:$('interval-mode').value,
    gapMin:clamp(+$('gap-min').value,0,10,.5)*1000,
    gapMax:clamp(+$('gap-max').value,0,10,1.5)*1000,
    rounds:+$('rounds').value,
    sets:+$('rounds').value?Math.round(clamp(+$('sets').value,1,99,1)):1,
    setRest:Math.round(clamp(+$('set-rest').value,0,600,30)),
    color:$('color').value
  };
  save();
  round=0;set=1;last=-1;lastNumberColor=-1;count=3;state='countdown';show('rest',false);
  $('stage').classList.remove('finished');$('stage').classList.add('active');
  show('result',false);show('controls',true);show('arrow',false);show('countdown',true);
  $('stage').classList.remove('paused');setCount(count);$('progress').style.width='0%';
  setPauseIcon(false);updatePhase();updateCounter();keepAwake();
  unlockSound().then(()=>{if(state==='countdown'&&count===3)cue()});
  schedule(tick,1000);
}
function setCount(n){
  $('count-num').textContent=n;
  const c=$('countdown');c.classList.remove('tick');void c.offsetWidth;c.classList.add('tick');
}
function tick(){
  count--;
  if(count>0){setCount(count);cue();schedule(tick,1000)}
  else{show('countdown',false);showArrow()}
}
function showArrow(){
  if(config.rounds&&round>=config.rounds)return completeSet();
  state='arrow';round++;
  if(config.mode==='numbers'){
    const n=1+Math.floor(Math.random()*5);
    const colors=NUMBER_COLORS.map((_,i)=>i).filter(i=>i!==lastNumberColor);
    lastNumberColor=colors[Math.floor(Math.random()*colors.length)];
    $('stage').style.setProperty('--number-bg',NUMBER_COLORS[lastNumberColor]);$('stage').classList.add('number-cue');
    $('number-cue').textContent=n;$('number-cue').setAttribute('aria-label','数字 '+n);show('number-cue',true);show('arrow',false);
  }else{
  const options=config.dirs===2?DIRS[2]:DIRS[config.dirs].filter(d=>d!==last);
  last=options[Math.floor(Math.random()*options.length)];
  const pal=PALETTE[isDark()?'dark':'light'];
  const arrow=$('arrow');
  arrow.style.transform=`rotate(${last}deg)`;
  arrow.style.color=config.color==='green'?pal[0]:config.color==='black'?'var(--text)':pal[Math.floor(Math.random()*pal.length)];
  arrow.setAttribute('aria-label',DIR_LABELS[last]);
  show('arrow',true);  }
  cue();updatePhase();updateCounter();
  $('progress').style.width=config.rounds?(round/config.rounds*100)+'%':'0%';
  schedule(blank,config.duration);
}
function clearNumberCue(){show('number-cue',false);$('stage').classList.remove('number-cue');$('stage').style.removeProperty('--number-bg');}
function blank(){
  clearNumberCue();show('arrow',false);
  if(config.rounds&&round>=config.rounds)return completeSet();
  state='blank';updatePhase();
  schedule(showArrow,nextGap(config));
}
function completeSet(){
  if(set>=config.sets)return finish();
  restSeconds=config.setRest;
  if(restSeconds===0)return nextSet();
  state='rest';$('rest-next').textContent='下一组 · 第 '+(set+1)+' / '+config.sets+' 组';
  show('arrow',false);show('rest',true);if(restSeconds>3)cue();renderRest();updatePhase();schedule(restTick,1000);animateRestRing();
}
function renderRest(){const preparing=restSeconds<=3;$('stage').classList.toggle('resting',!preparing);show('rest',!preparing);show('countdown',preparing);if(preparing){resetGroupProgress();setCount(restSeconds);cue();$('counter').textContent='0 / '+config.rounds;}else{$('rest-time').textContent=Math.floor(restSeconds/60)+':'+String(restSeconds%60).padStart(2,'0');}updatePhase();}
function animateRestRing(){
  cancelAnimationFrame(restFrame);
  const paused=state==='paused'&&resumeState==='rest';
  if((state!=='rest'&&!paused)||restSeconds<=3)return;
  const remaining=Math.max(0,(restSeconds-1)*1000+(paused?left:Math.max(0,due-performance.now())));
  $('rest-ring-fill').style.strokeDashoffset=String(1-Math.min(1,remaining/(config.setRest*1000)));
  if(!paused)restFrame=requestAnimationFrame(animateRestRing);
}
function restTick(){restSeconds--;if(restSeconds<=0)return nextSet();renderRest();schedule(restTick,1000);}
function resetGroupProgress(){const p=$('progress');p.style.transition='none';p.style.width='0%';void p.offsetWidth;p.style.transition='';}
function nextSet(){resetGroupProgress();$('stage').classList.remove('resting');cancelAnimationFrame(restFrame);set++;round=0;last=-1;show('rest',false);show('countdown',false);showArrow();}
function togglePause(){
  if(state==='idle'||state==='done')return;
  if(state==='paused'){
    state=resumeState;unlockSound();setPauseIcon(false);updatePhase();$('stage').classList.remove('paused');
    schedule(next,left);keepAwake();if(state==='rest')animateRestRing();
  }else{
    resumeState=state;state='paused';
    left=Math.max(0,due-performance.now());clearTimeout(timer);
    setPauseIcon(true);updatePhase();$('stage').classList.add('paused');if(resumeState==='rest')animateRestRing();
  }
}
function finish(){
  clearNumberCue();
  $('stage').classList.remove('resting');
  cancelAnimationFrame(restFrame);
  clearTimeout(timer);state='done';$('stage').classList.add('finished');$('stage').classList.remove('paused');
  show('arrow',false);show('rest',false);show('countdown',false);show('controls',false);show('result',true);
  updatePhase();
  releaseWake();stopKeepAlive();
}
function exit(){clearNumberCue();$('stage').classList.remove('resting');cancelAnimationFrame(restFrame);$('stage').classList.remove('finished');clearTimeout(timer);state='idle';$('stage').classList.remove('paused');$('stage').classList.remove('active');releaseWake();stopKeepAlive()}

/* ---------- 绑定 ---------- */
load();applyTheme();syncSound();
for(const k of KEYS)$(k).addEventListener('change',save);
$('theme').addEventListener('change',applyTheme);
darkQuery.addEventListener('change',applyTheme);
$('sound').onclick=()=>setSound(!soundOn());
$('mute').onclick=()=>{if(soundOn()){setSound(false);}else{if(+$('volume').value===0)$('volume').value='40';setSound(true).then(cue);}};
$('volume').oninput=()=>{syncSound();save()};
$('preview').onclick=async()=>{await unlockSound();cue()};
$('sound-type').addEventListener('change',()=>$('preview').click());
function syncTrainingMode(){
  const numbers=$('training-mode').value==='numbers';
  for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===$('training-mode').value));
  $('dirs-field').hidden=numbers;$('color-field').hidden=numbers;$('number-help').hidden=!numbers;
  $('home-title').textContent=numbers?'数字反应':'箭头反应';show('home-arrow',!numbers);show('home-number',numbers);
}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{$('training-mode').value=b.dataset.mode;syncTrainingMode();sessionInfo();save()};
syncTrainingMode();
const presets=[...document.querySelectorAll('[data-speed]')];
function syncPresets(){
  const d=+$('duration').value,g=+$('gap').value;
  for(const b of presets){const random=$('interval-mode').value==='random';const [pd,pg,pm]=(random?b.dataset.randomSpeed:b.dataset.speed).split(',').map(Number);const matches=Math.abs(d-pd)<1e-9&&(random?Math.abs(+$('gap-min').value-pg)<1e-9&&Math.abs(+$('gap-max').value-pm)<1e-9:Math.abs(g-pg)<1e-9);b.setAttribute('aria-pressed',String(matches));}
}
presets.forEach(b=>b.onclick=()=>{if($('interval-mode').value==='random'){[$('duration').value,$('gap-min').value,$('gap-max').value]=b.dataset.randomSpeed.split(',');$('gap-max').setCustomValidity('');}else{[$('duration').value,$('gap').value]=b.dataset.speed.split(',');}syncPresets();save()});
for(const k of ['duration','gap'])$(k).addEventListener('input',()=>{syncPresets();save()});
syncPresets();
$('start').onclick=start;$('again').onclick=start;
$('pause').onclick=togglePause;$('exit').onclick=exit;$('back').onclick=()=>{exit();openSettings()};


function nextGap(c){return c.intervalMode==='random'?c.gapMin+Math.random()*(c.gapMax-c.gapMin):c.gap;}
function syncIntervals(){for(const b of document.querySelectorAll('[data-interval]'))b.setAttribute('aria-pressed',String(b.dataset.interval===$('interval-mode').value));const random=$('interval-mode').value==='random';$('fixed-interval').hidden=random;$('random-interval').hidden=!random;$('gap').disabled=random;$('gap-min').disabled=!random;$('gap-max').disabled=!random;}
function validateIntervals(){const random=$('interval-mode').value==='random';const fields=random?['gap-min','gap-max']:['gap'];for(const k of fields){const el=$(k),fallback=k==='gap-max'?1.5:.5;el.value=String(clamp(el.value.trim()===''?NaN:+el.value,0,10,fallback));}const invalid=random&&+$('gap-min').value>+$('gap-max').value;$('gap-max').setCustomValidity(invalid?'最长等待不能小于最短等待。':'');if(!invalid)save();return !invalid;}
for(const b of document.querySelectorAll('[data-interval]'))b.onclick=()=>{$('interval-mode').value=b.dataset.interval;syncIntervals();syncPresets();save();sessionInfo()};
for(const k of ['gap-min','gap-max'])$(k).addEventListener('input',()=>{$('gap-max').setCustomValidity('');syncPresets();save();sessionInfo()});
syncIntervals();
const groupPresets={sets:['1','2','3','4','5','6','8','10'],'set-rest':['0','10','15','20','30','45','60','90','120','180']};
function syncGroupChoice(k){const custom=!groupPresets[k].includes($(k).value);$(k+'-choice').value=custom?'custom':$(k).value;$(k+'-custom-wrap').hidden=!custom;$(k+'-custom').value=$(k).value;}
for(const k of ['sets','set-rest']){
  const input=$(k+'-custom'),min=k==='sets'?1:0,max=k==='sets'?99:600;
  $(k+'-choice').onchange=()=>{const custom=$(k+'-choice').value==='custom';$(k+'-custom-wrap').hidden=!custom;if(custom){input.value=$(k).value;input.focus();}else $(k).value=$(k+'-choice').value;sessionInfo();save();};
  input.oninput=()=>{const n=+input.value;if(input.value!==''&&Number.isFinite(n)&&n>=min&&n<=max){$(k).value=String(Math.floor(n));sessionInfo();save();}};
  input.onchange=()=>{input.value=String(Math.round(clamp(input.value.trim()===''?NaN:+input.value,min,max,+$(k).value)));$(k).value=input.value;sessionInfo();save();};
  syncGroupChoice(k);
}


/* Round presets with a separate custom entry. */
function syncRoundChoice(){const value=$('rounds').value;const preset=['10','20','30','50','100','0'].includes(value);$('rounds-choice').value=preset?value:'custom';$('custom-rounds').hidden=preset;if(!preset)$('rounds-custom').value=value;}
$('rounds-choice').onchange=()=>{const value=$('rounds-choice').value;const custom=value==='custom';$('custom-rounds').hidden=!custom;if(custom){const n=+$('rounds-custom').value;$('rounds').value=String(Number.isFinite(n)&&n>=1?Math.floor(n):20);$('rounds-custom').value=$('rounds').value;$('rounds-custom').focus();}else $('rounds').value=value;save();sessionInfo();};
$('rounds-custom').oninput=()=>{const raw=$('rounds-custom').value;const n=+raw;if(raw!==''&&Number.isFinite(n)&&n>=1){$('rounds').value=String(Math.floor(n));save();sessionInfo()}};
$('rounds-custom').onchange=()=>{$('rounds-custom').value=$('rounds').value==='0'?'20':$('rounds').value;};
syncRoundChoice();
/* Settings dialog: native focus management and keyboard dismissal. */
const settingsDialog=$('settings-dialog');let settingsClosing=false;
function openSettings(){if(settingsDialog.open||settingsClosing)return;settingsDialog.showModal();}
function closeSettings(){if(!settingsDialog.open||settingsClosing)return;settingsClosing=true;settingsDialog.classList.add('is-closing');setTimeout(()=>{settingsDialog.close();settingsDialog.classList.remove('is-closing');settingsClosing=false;},matchMedia('(prefers-reduced-motion: reduce)').matches?0:200);}
$('open-settings').onclick=openSettings;$('close-settings').onclick=closeSettings;$('done-settings').onclick=()=>{if(validateIntervals()){sessionInfo();closeSettings()}else{$('gap-max').focus();$('gap-max').reportValidity()}};
settingsDialog.addEventListener('cancel',e=>{e.preventDefault();closeSettings()});
settingsDialog.addEventListener('click',e=>{if(e.target!==settingsDialog)return;const r=settingsDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSettings()});
function sessionInfo(){const d=$('dirs').value,n=$('rounds').value,unlimited=n==='0';for(const k of ['sets','set-rest']){const disabled=unlimited||k==='set-rest'&&+$('sets').value<=1;$(k+'-choice').disabled=disabled;$(k+'-custom').disabled=disabled;}$('sets-help').textContent=unlimited?'无限循环不分组，结束时手动停止。':+$('sets').value<=1?'单组练习，无组间休息。':'每组完成后休息，倒计时结束自动继续。';$('session-info').textContent=($('training-mode').value==='numbers'?'数字 1–5':d+' 个方向')+' · '+(unlimited?'无限循环':$('sets').value+' 组 × '+n+' 轮')+' · '+($('interval-mode').value==='random'?'随机间隔':$('duration').value+' 秒');}
for(const k of ['dirs','rounds','duration'])$(k).addEventListener('change',sessionInfo);$('rounds').addEventListener('input',sessionInfo);
$('duration').addEventListener('input',sessionInfo);document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',sessionInfo));sessionInfo();

/* 首页指针：随机转向，预告练习内容 */
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
let homeAngle=45,homeDir=45;
function spinHome(){
  if($('stage').classList.contains('active')||document.hidden||reduceMotion.matches)return;
  if($('training-mode').value==='numbers'){$('home-number').textContent=1+Math.floor(Math.random()*5);return;}
  const options=DIRS[8].filter(d=>d!==homeDir);
  const d=options[Math.floor(Math.random()*options.length)];
  homeAngle+=((d-homeDir+540)%360)-180;homeDir=d;
  $('home-arrow').style.transform=`rotate(${homeAngle}deg)`;
  document.querySelectorAll('.tick-mark').forEach(t=>t.classList.toggle('on',+t.dataset.deg===d));
}
setInterval(spinHome,1800);
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{
  if(settingsDialog.open)return;
  if(state==='idle')return;
  if(e.code==='Space'){e.preventDefault();togglePause()}
  if(e.key==='Escape')exit();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['countdown','arrow','blank','rest'].includes(state))togglePause()});
</script>
