<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f6f7f2"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>箭头反应 · Arrow Flow</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20372c;background:#f6f7f2}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #66a686;outline-offset:4px}header{max-width:1140px;margin:auto;padding:30px 28px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:650;letter-spacing:.05em}.small{font-size:12px;letter-spacing:.13em;color:#718075}main{max-width:1140px;margin:auto;padding:26px 28px 48px}.intro{margin-bottom:28px}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.045em;margin:12px 0}p{color:#718075;line-height:1.7}.layout{display:grid;grid-template-columns:1fr 310px;gap:22px}.preview{min-height:460px;background:#fff;border:1px solid #e2e7dc;border-radius:24px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview .sample{width:145px;height:145px;color:#22ab76;transform:rotate(225deg)}.badge{position:absolute;left:22px;top:22px;font-size:12px;color:#718075;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:#26ab76}.preview-note{position:absolute;bottom:22px;color:#8b958c;font-size:12px}.settings{background:#eef1e8;border-radius:24px;padding:25px}h2{font-size:17px;margin:0 0 23px}label{display:block;font-size:13px;margin:20px 0 9px}select,input[type=number]{width:100%;border:1px solid #d7dfd2;border-radius:10px;background:#fafbf8;padding:11px;color:#20372c}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;margin:13px 0 22px}.primary{border:0;background:#245b42;color:white;padding:15px 22px;border-radius:12px;font-weight:600;width:100%}.primary:hover{background:#19482f}.secondary{border:1px solid #d7dfd2;background:transparent;color:#47604c;padding:11px 16px;border-radius:10px}.presets{display:flex;gap:7px;margin-top:16px}.presets button{font-size:12px;flex:1;padding:8px 4px}.foot{display:flex;gap:28px;font-size:12px;color:#7b877d;margin:24px 2px}.stage{display:none;position:fixed;inset:0;background:white;z-index:10;align-items:center;justify-content:center}.stage.active{display:flex}.stage svg{width:clamp(165px,36vmin,480px);height:clamp(165px,36vmin,480px)}.top{position:absolute;top:max(22px,env(safe-area-inset-top));left:24px;right:24px;display:flex;justify-content:space-between;align-items:center}.counter{border:1px solid #dfe5df;border-radius:8px;min-width:70px;padding:9px 12px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}.controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;justify-content:space-between;align-items:center}.roundbtn{border:1px solid #dbe2da;border-radius:50%;width:48px;height:48px;background:white;color:#46654f;font-size:18px}.exit{border:0;background:transparent;color:#809184;font-size:13px}.status{font-size:12px;letter-spacing:.05em;color:#839487}.countdown{font-size:100px;font-weight:300;color:#245b42}.result{text-align:center;padding:30px}.result h2{font-size:32px;margin:15px 0}.result .primary{margin-top:18px}.result .secondary{margin-top:12px;width:100%}.progress{position:absolute;bottom:0;left:0;height:3px;background:#dceade;transition:width .15s linear}.hidden{display:none!important}svg{display:block}@media(max-width:760px){header{padding:22px}.small.hide-mobile{display:none}main{padding:10px 20px 30px}.layout{grid-template-columns:1fr}.preview{min-height:260px}.preview .sample{width:110px;height:110px}.settings{padding:23px}.foot{gap:14px;flex-wrap:wrap}.intro p{font-size:14px;margin-bottom:22px}.intro{margin-bottom:20px}h1{margin-top:8px}}@media(max-height:500px){.stage svg{width:48vmin;height:48vmin}.controls{bottom:12px}.top{top:12px}}

:root{background:#fff;color:#252925}.minimal-home{min-height:100svh;max-width:420px;padding:60px 28px 40px;display:flex;flex-direction:column;align-items:center;margin:auto}.home-mark{font-size:10px;letter-spacing:.22em;color:#929992}.home-arrow{width:130px;height:130px;color:#29976b;transform:rotate(45deg);margin:clamp(64px,15vh,145px) 0 34px}.minimal-home h1{font-size:18px;font-weight:400;letter-spacing:.13em;margin:0 0 44px}.home-start{width:156px;background:#262c28;border-radius:6px;font-size:14px;font-weight:400;padding:13px}.home-start:hover{background:#424b44}.minimal-settings{width:100%;margin-top:21px}.minimal-settings summary{list-style:none;text-align:center;cursor:pointer;font-size:12px;color:#858c86;padding:12px;min-height:44px}.minimal-settings summary::-webkit-details-marker{display:none}.minimal-settings summary:after{content:' +';margin-left:4px}.minimal-settings[open] summary:after{content:' −'}.minimal-settings summary:focus-visible{outline:2px solid #29976b;outline-offset:2px}.settings-body{padding:7px 0 20px;border-top:1px solid #edf0eb;margin-top:12px}.settings-body label{color:#68716a;font-size:12px}.settings-body select,.settings-body input{background:#fff;border-color:#e4e8e2;border-radius:6px}.settings-body .secondary{border-color:#e4e8e2;border-radius:6px}.settings-body .presets{margin-top:24px}@media(max-height:600px){.minimal-home{padding-top:25px}.home-arrow{margin-top:35px;margin-bottom:20px;width:98px;height:98px}.minimal-home h1{margin-bottom:24px}}

.sound-settings{margin-top:24px;padding:20px 0 0;border-top:1px solid #edf0eb}.sound-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.sound-title{font-size:13px;color:#303d33}.sound-description{font-size:11px;color:#8a938c;margin:5px 0 0;line-height:1.5}.sound-switch{border:0;padding:3px;width:44px;height:26px;background:#dfe4df;border-radius:20px;flex-shrink:0;transition:background .18s}.sound-switch span{display:block;width:20px;height:20px;background:white;border-radius:50%;box-shadow:0 1px 3px #0002;transition:transform .18s}.sound-switch[aria-checked="true"]{background:#29976b}.sound-switch[aria-checked="true"] span{transform:translateX(18px)}#sound-panel{margin-top:23px}#sound-panel[hidden]{display:none}.volume-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.settings-body .volume-heading label{margin:0;font-size:12px}#volume-value{font-size:12px;color:#69756c;font-variant-numeric:tabular-nums}#volume{display:block;width:100%;height:5px;border-radius:6px;appearance:none;-webkit-appearance:none;background:linear-gradient(to right,#29976b 40%,#e7ebe7 40%);margin:18px 0 20px;cursor:pointer;touch-action:pan-y}#volume::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:20px;height:20px;background:white;border:1px solid #d6ddd7;border-radius:50%;box-shadow:0 1px 4px #0002}#volume::-moz-range-thumb{width:18px;height:18px;background:white;border:1px solid #d6ddd7;border-radius:50%;box-shadow:0 1px 4px #0002}.sound-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px;color:#949b95}#preview-sound{font-size:12px;color:#397052;background:transparent;border:1px solid #e2e8e2;padding:8px 14px;min-height:36px;border-radius:6px}#preview-sound:disabled{color:#a4aba5;cursor:default} @media(prefers-reduced-motion:reduce){.sound-switch,.sound-switch span{transition:none}}
</style></head><body><main class="minimal-home"><div class="home-mark">ARROW FLOW</div><svg class="home-arrow" viewBox="0 0 100 100" aria-label="方向箭头"><path d="M50 88V13M17 46L50 13L83 46" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="miter"/></svg><h1>箭头反应</h1><button id="start" class="primary home-start">开始</button><details class="minimal-settings"><summary>设置</summary><div class="settings-body"><label for="dirs">箭头方向</label><select id="dirs"><option value="8">八方向（含斜向）</option><option value="4">四方向（上下左右）</option><option value="2">两方向（左右）</option></select><div class="two"><div><label for="duration">显示 / 秒</label><input id="duration" type="number" min="0.3" max="10" step="0.1" value="1.5"></div><div><label for="gap">留白 / 秒</label><input id="gap" type="number" min="0" max="10" step="0.1" value="0.5"></div></div><div class="two"><div><label for="rounds">练习轮数</label><select id="rounds"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="0">无限循环</option></select></div><div><label for="color">箭头颜色</label><select id="color"><option value="random">随机彩色</option><option value="green">固定绿色</option><option value="black">固定黑色</option></select></div></div><section class="sound-settings" aria-label="声音设置"><div class="sound-heading"><div><span class="sound-title">提示音</span><p class="sound-description">箭头出现时播放短音</p></div><button id="sound" class="sound-switch" type="button" role="switch" aria-label="提示音" aria-checked="false" value="off"><span></span></button></div><div id="sound-panel" hidden><label for="sound-type" style="margin-top:0">声音类型</label><select id="sound-type" style="margin-bottom:22px"><option value="beep">标准短音</option><option value="double">双声提示</option><option value="bell">轻柔铃声</option><option value="buzzer">强力蜂鸣</option><option value="alarm">急促警报</option><option value="impact">重击音</option></select><div class="volume-heading"><label for="volume">提示音量</label><output id="volume-value" for="volume">40%</output></div><input id="volume" type="range" min="0" max="100" value="40" aria-describedby="volume-help"><div class="sound-bottom"><span id="volume-help">同时受设备音量控制</span><button type="button" id="preview-sound">试听</button></div></div></section><div class="presets"><button class="secondary" data-speed="2.5,1">舒缓</button><button class="secondary" data-speed="1.5,0.5">标准</button><button class="secondary" data-speed="0.7,0.3">快速</button></div></div></details></main><section id="stage" class="stage" aria-label="反应练习"><div class="top"><span class="status" id="phase">准备开始</span><span class="counter" id="counter">0 / 20</span></div><svg id="arrow" class="hidden" viewBox="0 0 100 100" role="img" aria-label="方向箭头"><path d="M50 88V13M17 46L50 13L83 46" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="miter"/></svg><div id="countdown" class="countdown">3</div><div id="result" class="result hidden"><span class="small">SESSION COMPLETE</span><h2>这一轮，完成了。</h2><p id="summary"></p><button id="again" class="primary">再练一次 ↗</button><button id="back" class="secondary">调整设置</button></div><div class="controls" id="controls"><button id="pause" class="roundbtn" aria-label="暂停">Ⅱ</button><button id="exit" class="exit">结束练习</button></div><div class="progress" id="progress"></div></section><script>
const $=id=>document.getElementById(id),palette=['#20ac78','#823ac7','#257bdd','#e2812b','#dc4168'];let state='idle',prior='',timer=null,due=0,left=0,round=0,config={},last=-1,count=3,wake=null;
function schedule(fn,ms){clearTimeout(timer);next=fn;left=ms;due=performance.now()+ms;timer=setTimeout(fn,ms)}let next=()=>{};
function visible(id,on){$(id).classList.toggle('hidden',!on)}
function save(){try{localStorage.setItem('arrow-flow',JSON.stringify(Object.fromEntries(['dirs','duration','gap','rounds','color','sound','volume','sound-type'].map(k=>[k,$(k).value]))))}catch{}}
try{const s=JSON.parse(localStorage.getItem('arrow-flow')||'null');if(s)for(const k of ['dirs','duration','gap','rounds','color','sound','volume','sound-type'])if(s[k]!=null)$(k).value=s[k]}catch{}
if(!$('sound-type').value)$('sound-type').value='beep';
for(const k of ['dirs','duration','gap','rounds','color','sound','volume','sound-type'])$(k).onchange=save;
function syncSound(){const enabled=$('sound').value==='on';$('sound').setAttribute('aria-checked',String(enabled));$('sound-panel').hidden=!enabled;$('volume').disabled=!enabled;const v=+$('volume').value;$('volume-value').textContent=v===0?'静音':v+'%';$('volume').setAttribute('aria-valuetext',v===0?'静音':v+'%');$('volume').style.background='linear-gradient(to right,#29976b '+v+'%,#e7ebe7 '+v+'%)';$('preview-sound').disabled=!enabled||v===0;}
$('sound').onclick=()=>{$('sound').value=$('sound').value==='on'?'off':'on';syncSound();save()};
$('volume').oninput=()=>{syncSound();save()};syncSound();
$('preview-sound').onclick=async()=>{await unlockSound();beep({sound:$('sound').value,volume:+$('volume').value/100,tone:$('sound-type').value})};

document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{[$('duration').value,$('gap').value]=b.dataset.speed.split(',');save()});
async function keepAwake(){try{wake=await navigator.wakeLock?.request('screen')}catch{}}
let audioCtx=null;
async function unlockSound(){if($('sound').value!=='on')return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')await audioCtx.resume();}catch{}}
let cueNodes=[];
function beep(settings=config){if(settings.sound!=='on'||settings.volume<=0||!audioCtx||audioCtx.state!=='running')return;try{for(const n of cueNodes){try{n.stop()}catch{}}cueNodes=[];const t=audioCtx.currentTime,v=settings.volume*settings.volume*.25;const tone=(freq,duration,offset=0,type='sine',level=1,endFreq=null)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),at=t+offset;osc.type=type;osc.frequency.setValueAtTime(freq,at);if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,at+duration);gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(v*level,at+.005);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);gain.gain.setValueAtTime(0,at+duration+.005);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(at);osc.stop(at+duration+.01);cueNodes.push(osc);osc.onended=()=>{osc.disconnect();gain.disconnect();cueNodes=cueNodes.filter(n=>n!==osc)}};
switch(settings.tone){case 'double':tone(880,.065);tone(880,.065,.105);break;case 'buzzer':tone(220,.16,0,'sawtooth',.48);tone(440,.13,0,'square',.18);break;case 'alarm':tone(1200,.065,0,'square',.36);tone(1500,.065,.085,'square',.36);tone(1200,.065,.17,'square',.36);break;case 'impact':tone(160,.18,0,'sine',1.4,45);tone(850,.045,0,'triangle',.65,130);break;case 'bell':tone(1046.5,.23,0,'sine',.8);tone(1568,.16,0,'sine',.25);break;default:tone(880,.12);}}catch{}}

function start(){unlockSound();config={dirs:+$('dirs').value,duration:Math.max(.3,Math.min(10,+$('duration').value||1.5))*1000,gap:Math.max(0,Math.min(10,+$('gap').value||0))*1000,rounds:+$('rounds').value,color:$('color').value,sound:$('sound').value,tone:$('sound-type').value,volume:Math.max(0,Math.min(100,+$('volume').value))/100};save();round=0;last=-1;count=3;state='countdown';$('stage').classList.add('active');visible('result',false);visible('controls',true);visible('arrow',false);visible('countdown',true);$('countdown').textContent=count;$('phase').textContent='准备开始';$('pause').textContent='Ⅱ';$('pause').setAttribute('aria-label','暂停');$('progress').style.width='0%';updateCounter();keepAwake();schedule(tick,1000)}
function tick(){count--;if(count>0){$('countdown').textContent=count;schedule(tick,1000)}else{visible('countdown',false);showArrow()}}
function updateCounter(){$('counter').textContent=config.rounds?round+' / '+config.rounds:String(round)}
function showArrow(){if(config.rounds&&round>=config.rounds){finish();return}state='arrow';round++;let dirs=config.dirs===2?[90,270]:config.dirs===4?[0,90,180,270]:[0,45,90,135,180,225,270,315];let options=dirs.filter(d=>d!==last);last=options[Math.floor(Math.random()*options.length)];$('arrow').style.transform='rotate('+last+'deg)';$('arrow').style.color=config.color==='green'?palette[0]:config.color==='black'?'#18221d':palette[Math.floor(Math.random()*palette.length)];$('arrow').setAttribute('aria-label',({0:'上',45:'右上',90:'右',135:'右下',180:'下',225:'左下',270:'左',315:'左上'})[last]);visible('arrow',true);beep();$('phase').textContent='跟随方向';updateCounter();$('progress').style.width=config.rounds?(round/config.rounds*100)+'%':'0%';schedule(blank,config.duration)}
function blank(){visible('arrow',false);if(config.rounds&&round>=config.rounds){finish();return}state='blank';$('phase').textContent='等待下一个提示';schedule(showArrow,config.gap)}
function pause(){if(['done','idle'].includes(state))return;if(state==='paused'){unlockSound();state=prior;$('phase').textContent=state==='blank'?'等待下一个提示':state==='countdown'?'准备开始':'跟随方向';$('pause').textContent='Ⅱ';$('pause').setAttribute('aria-label','暂停');schedule(next,left);keepAwake()}else{prior=state;state='paused';left=Math.max(0,due-performance.now());clearTimeout(timer);$('phase').textContent='已暂停';$('pause').textContent='▶';$('pause').setAttribute('aria-label','继续')}}
function release(){try{wake?.release()}catch{}wake=null}
function finish(){clearTimeout(timer);state='done';visible('arrow',false);visible('countdown',false);visible('controls',false);visible('result',true);$('phase').textContent='练习完成';$('summary').textContent='完成了 '+round+' 次方向提示。休息一下，再开始下一轮。';release()}
function exit(){clearTimeout(timer);state='idle';$('stage').classList.remove('active');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});release()}
$('start').onclick=start;$('again').onclick=start;$('pause').onclick=pause;$('exit').onclick=exit;$('back').onclick=exit;

document.addEventListener('keydown',e=>{if(state==='idle')return;if(e.code==='Space'){e.preventDefault();pause()}if(e.key==='Escape')exit()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!['idle','done','paused'].includes(state))pause()});
</script></body></html>
